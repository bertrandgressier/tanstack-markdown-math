name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test

  peer-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # supported @tanstack/markdown versions with inlineComponent nodes (>= 0.0.15);
        # 0.0.13/0.0.14 still satisfy the peer range but only support 'html' output mode
        markdown: ['0.0.15', '0.0.16', '1.0.0']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm add -D @tanstack/markdown@${{ matrix.markdown }}
      - run: pnpm run typecheck
      - run: pnpm test
